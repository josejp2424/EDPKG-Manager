  <rect x="20" y="33" width="84" height="19" rx="4" fill="#d8cfbe"/>
  <!-- cinta vertical, por detras de la etiqueta -->
  <rect x="55" y="33" width="14" height="71" fill="#e8933a"/>
  <!-- linea de apertura -->
  <rect x="20" y="50" width="84" height="2.5" fill="#000000" opacity="0.13"/>

  <!-- etiqueta de envio -->
  <rect x="31" y="66" width="62" height="24" rx="3" fill="#ffffff"/>

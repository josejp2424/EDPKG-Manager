<!--
  edpkg-manager.svg — icono de aplicacion para la GUI de edpkg.

  Una caja de paquete con una etiqueta de envio que dice .deb, y un engranaje
  que la marca como herramienta de gestion y no como un paquete suelto.

  Deliberadamente NO usa el espiral de Debian ni el logo de Devuan: ambos son
  marcas registradas y su uso en el icono de una distro de terceros es un
  problema que aparece tarde y cuesta deshacer. La extension literal comunica
  lo mismo y no tiene dueno.

  El texto ".deb" son trazos vectoriales, no <text>: asi no depende de que la
  fuente este instalada. Si hiciera falta regenerarlo, sale de Liberation Sans
  Bold convertida a contornos.

  Colores literales (librsvg no resuelve var() de forma fiable en versiones
  viejas). Para re-tematizar, buscar y reemplazar:
    #14504f  fondo, teal profundo
    #f2ede3  carton claro
    #d8cfbe  carton en sombra
    #e8933a  acento: cinta y engranaje
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"
     width="128" height="128" role="img" aria-label="Gestor de paquetes .deb de edpkg">

  <rect x="0" y="0" width="128" height="128" rx="28" fill="#14504f"/>

  <ellipse cx="62" cy="106" rx="38" ry="5" fill="#000000" opacity="0.18"/>

